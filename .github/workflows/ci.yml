name: CI
on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'test.configs/**'
      - '.vscode/'
      - 'appcast.xml'
  push:
    branches:
       - main
       - dev
       - android-fix-action-bug
       - new-design-v2 
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/'
      - 'appcast.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

run-name: "CI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  run:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      actions: write
      checks: write
      pull-requests: write
      issues: write
      statuses: write
      id-token: write
    if: "${{!contains(github.event.head_commit.message, 'release: version')}}"
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      upload-artifact: ${{ github.event_name == 'push' }}
      
